name: AI-v1.2.1 registry compatibility verification

on:
  push:
    branches:
      - verify/ai-v1.3-crypto-design-20261008

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR 42 candidate
        uses: actions/checkout@v4
        with:
          ref: f040e0ed8bde83d29b6c556c26f6ee2efd1a2372
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: pwsh
        run: |
          $Expected = "f040e0ed8bde83d29b6c556c26f6ee2efd1a2372"
          $Actual = (git rev-parse HEAD).Trim()
          Write-Host "EXPECTED_CANDIDATE=$Expected"
          Write-Host "ACTUAL_CANDIDATE=$Actual"
          if ($Actual -ne $Expected) {
            throw "Candidate identity mismatch"
          }
          Write-Host "CANDIDATE_IDENTITY=PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mt5,research,app,dev]"

      - name: Focused registry compatibility tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_ai_v1_2_1_registry_compatibility.py tests/test_ai_v1_runtime_v1_2_1_correction.py tests/test_ai_v1_activation_v1_2_1.py tests/test_ai_v1_scheduler_v1_2_1_p3.py tests/test_ai_v1_3_crypto_runtime_package.py

      - name: Full regression suite
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Ruff changed Python surface
        shell: pwsh
        run: |
          python -m ruff check src/trading_signal_intelligence/ai_v1/registry_compat_v1_2_1.py src/trading_signal_intelligence/ai_v1/runtime_verifier_registry_compat_v1_2_1.py scripts/run_ai_v1_2_1_live_registry_compat.py scripts/verify_ai_v1_2_1_registry_compat_runtime.py scripts/activate_ai_v1_3_crypto.py src/trading_signal_intelligence/ai_v1/crypto_runtime_verifier_v1_3.py tests/test_ai_v1_2_1_registry_compatibility.py

      - name: Prove original frozen AI-v1.2.1 files unchanged
        shell: pwsh
        run: |
          python -m pytest -q tests/test_ai_v1_2_1_registry_compatibility.py -k original_v1_2_1_frozen_runtime_files_remain_byte_exact

      - name: Safety summary
        shell: pwsh
        run: |
          Write-Host "AI_V1_2_1_REGISTRY_COMPAT_VERIFICATION=PASS"
          Write-Host "PRODUCTION_MERGE=FALSE"
          Write-Host "SCHEDULER_CHANGED=FALSE"
          Write-Host "MT5_CALL=FALSE"
          Write-Host "OPENAI_PROVIDER_CALL=FALSE"
          Write-Host "LEDGER_MUTATION=FALSE"
          Write-Host "AI_V1_3_ACTIVATION=FALSE"
          Write-Host "PUBLIC_EXPOSURE_CHANGE=FALSE"
          Write-Host "BROKER_EXECUTION_CHANGE=FALSE"
