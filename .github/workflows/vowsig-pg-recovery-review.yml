name: VowSig PG18 encrypted backup worker review

on:
  pull_request:
    paths:
      - '.github/workflows/vowsig-pg-recovery-review.yml'
      - 'ops/pg_recovery/**'
      - 'tests/test_vowsig_pg_backup_worker.py'
      - 'config/tls/railway-postgres-root-ca-20261104.pem'

permissions:
  contents: read

jobs:
  encrypted-pg-worker-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only offline test runner
        run: python -m pip install pytest
      - name: Compile guarded scripts
        run: python -m py_compile ops/pg_recovery/backup.py ops/pg_recovery/verify_restore.py
      - name: Test simulated dual provider and fail closed guards
        run: python -m pytest -q tests/test_vowsig_pg_backup_worker.py
      - name: Build isolated worker container without credentials or deployment
        run: docker build --file ops/pg_recovery/Dockerfile --tag vowsig-pg-recovery-review:local .
