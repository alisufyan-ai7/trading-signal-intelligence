name: AI-v1.3 crypto design verification

on:
  push:
    branches:
      - verify/ai-v1.3-crypto-design-20261008

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR 41 candidate
        uses: actions/checkout@v4
        with:
          ref: c07da481de2e96bb1032d3525f92ade5eecc2bcf
          fetch-depth: 1

      - name: Verify exact candidate identity
        shell: pwsh
        run: |
          $Expected = "c07da481de2e96bb1032d3525f92ade5eecc2bcf"
          $Actual = (git rev-parse HEAD).Trim()
          Write-Host "EXPECTED_CANDIDATE=$Expected"
          Write-Host "ACTUAL_CANDIDATE=$Actual"
          if ($Actual -ne $Expected) {
            throw "Candidate identity mismatch"
          }
          Write-Host "CANDIDATE_IDENTITY=PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mt5,research,app,dev]"

      - name: Exact Ruff safe-fix diagnostic
        shell: pwsh
        run: |
          python -m ruff check src/trading_signal_intelligence/connectors/binance.py src/trading_signal_intelligence/ai_v1/crypto_readiness_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_cost_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_guardrails_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_engine_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_signals_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_activation_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_runtime_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_observability_v1_3.py src/trading_signal_intelligence/ai_v1/crypto_runtime_verifier_v1_3.py scripts/probe_ai_v1_3_crypto_readiness.py scripts/run_ai_v1_3_crypto_live.py scripts/preview_ai_v1_3_crypto_activation.py scripts/verify_ai_v1_3_crypto_pre_activation.py scripts/verify_ai_v1_3_crypto_runtime.py scripts/report_ai_v1_3_crypto_progress.py scripts/activate_ai_v1_3_crypto.py tests/test_ai_v1_3_crypto_expansion_design.py tests/test_ai_v1_3_crypto_readiness.py tests/test_ai_v1_3_crypto_cost_integration.py tests/test_ai_v1_3_crypto_runtime_package.py --fix
          Write-Host "----- BEGIN RUFF SAFE-FIX DIFF -----"
          git diff -- src/trading_signal_intelligence scripts tests/test_ai_v1_3_crypto_runtime_package.py
          Write-Host "----- END RUFF SAFE-FIX DIFF -----"
          throw "Diagnostic run only"

      - name: Safety summary
        shell: pwsh
        run: |
          Write-Host "AI_V1_3_CRYPTO_DESIGN_VERIFICATION=PASS"
          Write-Host "LIVE_BINANCE_CALL=FALSE"
          Write-Host "OPENAI_PROVIDER_CALL=FALSE"
          Write-Host "CRYPTO_LEDGER_CREATED=FALSE"
          Write-Host "SCHEDULER_CHANGED=FALSE"
          Write-Host "BROKER_EXECUTION=FALSE"
