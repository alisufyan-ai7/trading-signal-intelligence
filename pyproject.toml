[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-signal-intelligence"
version = "0.1.0"
description = "Research and engineering toolkit for verified broker-neutral trading signal intelligence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0"]
research = ["numpy>=1.26", "pandas>=2.2"]
app = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-dotenv>=1.0"]
accounts = ["psycopg[binary]>=3.2", "httpx>=0.27,<1", "PyJWT[crypto]>=2.10,<3"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
